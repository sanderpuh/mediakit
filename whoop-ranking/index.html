<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#7fb7be">
<meta name="description" content="Whoop season ranking — live scores from FPVScores.com.">
<title>Whoop Ranking — SanderPuh</title>
<link rel="icon" type="image/png" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<style>
/* ============================================================
   WHOOP RANKING — matches SANDERPUH site style (v5)
   Palette: #7fb7be (teal) · #fdc430 (yellow) · #e7860a (orange)
            #231000 (ink) · #eff0ec (card)
   Headers: Pronave (from parent folder). Body: system font.
   ============================================================ */
@font-face{
  font-family:'Pronave';
  src:url('../Pronave.ttf') format('truetype');
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --bg:#7fb7be;
  --teal:#7fb7be;
  --teal-deep:#647577;
  --yellow:#fdc430;
  --orange:#e7860a;
  --ink:#231000;
  --card:#eff0ec;
  --card2:#e0e2d9;
  --muted:#54685e;
  --muted2:#676b5f;
  --border:rgba(35,16,0,.18);
  --body:'-apple-system',BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --head:'Pronave',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65}
::selection{background:var(--yellow);color:#231000}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}

/* ============================= TELEMETRY BAR (copied from main site) ============================= */
.telemetry{
  position:sticky;top:0;z-index:100;
  background:var(--ink);
  border-bottom:3px solid var(--yellow);
}
.telemetry .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:12px;padding-bottom:12px}
.t-item.t-drop{display:none}
.t-item.t-lq-group{gap:3px}
.t-therm{position:relative;display:inline-block;width:19px;height:26px;align-self:center}
.t-therm::before{content:"";position:absolute;left:3px;top:0;width:5px;height:20px;border-radius:2.5px;background:var(--card);z-index:1}
.t-therm::after{content:"";position:absolute;left:1px;bottom:0;width:9px;height:9px;border-radius:50%;background:var(--card);z-index:0}
.t-therm .fill{position:absolute;left:4px;bottom:4px;width:3px;border-radius:2px;background:var(--yellow);z-index:2}
.t-therm .bulb{position:absolute;left:2.5px;bottom:1px;width:6px;height:6px;border-radius:50%;background:var(--yellow);z-index:3}
.t-therm .ticks{position:absolute;left:9px;top:2.5px;height:15.5px;display:flex;flex-direction:column;justify-content:space-between}
.t-therm .ticks span{display:block;width:4px;height:2px;background:var(--card);border-radius:1px;margin-left:-1px}
.t-item.t-lq-group .t-lq{margin-left:0}
.t-item{display:flex;flex-direction:row;align-items:baseline;line-height:1.2}
.t-item.t-lq-item{margin-right:0}
.t-label{font-family:var(--head);font-size:14px;color:var(--card);line-height:1.1;margin-right:6px;text-transform:uppercase}
.t-value{font-family:var(--head);font-size:15px;color:var(--yellow);line-height:1.1}
.t-item.pilot .t-label{margin-right:4px}
.t-lq{display:inline-flex;align-items:flex-end;gap:2px;margin-left:6px}
.t-lq span{width:3px;background:var(--card);border-radius:1px;display:inline-block}
.t-lq span.on{background:var(--yellow)}
.t-lq span:nth-child(1){height:6px}
.t-lq span:nth-child(2){height:9px}
.t-lq span:nth-child(3){height:12px}
.t-lq span:nth-child(4){height:15px}
.t-lq span:nth-child(5){height:18px}

/* ===== hero ===== */
.hero{padding:56px 0 40px}
.hero h1{
  font-family:var(--head);font-size:clamp(2.6rem,7vw,4.6rem);line-height:.95;
  color:var(--ink);margin-bottom:6px;
}
.hero h1 .hl-y{color:var(--yellow)}
.hero-tagline{
  font-family:var(--head);font-size:clamp(1.05rem,2.4vw,1.4rem);color:var(--ink);
  margin-bottom:18px;
}
#status{color:#3d2a18;font-size:15px;min-height:1.3em;margin-bottom:18px}
#status.err{color:var(--ink);font-weight:600}

/* ===== table, like the site's log-table ===== */
.table-wrap{overflow-x:auto;padding-bottom:56px}
.rank-table{
  width:100%;min-width:760px;
  border-collapse:separate;border-spacing:0;
  background:var(--card);border:2px solid var(--ink);border-radius:14px;overflow:hidden;
}
.rank-table th{
  font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);
  text-align:left;padding:14px 16px;border-bottom:3px solid var(--ink);background:var(--card2);
  white-space:nowrap;
}
.rank-table td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:15.5px;color:#3d2a18;white-space:nowrap}
.rank-table tr:last-child td{border-bottom:none}
.rank-table tr:hover td{background:var(--card2)}
.rank-table th.sep,.rank-table td.sep{border-left:2px solid var(--border)}
th.num,td.num{text-align:right}
td.pilot{color:var(--ink);font-weight:600}
td.score{font-family:var(--head);font-size:1.1rem;color:var(--ink)}
td.num.missed{color:var(--muted2);font-weight:400}
td.rank-cell{text-align:center}
.rank-table th a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted2)}
.rank-table th a:hover{color:var(--ink);border-bottom-color:var(--ink)}
td.pilot a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted2)}
td.pilot a:hover{border-bottom-color:var(--ink);color:var(--ink)}
td.num.dropped{color:var(--muted2);text-decoration:line-through}
td.num.dropped a{color:inherit;text-decoration:line-through}
td.num a{color:inherit;text-decoration:none}
td.num a:hover{color:var(--accent);text-decoration:underline}

/* ===== rank pills, like the site's .res badges ===== */
.pos{display:inline-block;font-family:var(--head);min-width:46px;text-align:center;padding:4px 12px;font-size:1.05rem;line-height:1.5;border-radius:999px}
.pos.r-1{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.pos.r-2{background:var(--teal-deep);color:#fff;border:2px solid var(--ink)}
.pos.r-3{background:var(--orange);color:#fff;border:2px solid var(--ink)}
.pos.other{color:var(--muted2);border:1.5px solid var(--ink)}

/* ===== footer note ===== */
.note{font-size:14px;color:var(--muted2);padding-bottom:48px}
</style>
</head>
<body>
    <div class="telemetry">
        <div class="wrap" id="t-wrap">
            <span class="t-item t-therm-item"><span class="t-therm" title="Battery"><span class="fill"></span><span class="bulb"></span>
                <span class="ticks"><span></span><span></span><span></span><span></span><span></span></span></span></span>
            <span class="t-item" data-drop="1"><span class="t-label">Status:</span> <span class="t-value" id="t-status">Racing</span></span>
            <span class="t-item t-lq-group" data-keep="1"><span class="t-value" style="color:var(--yellow);font-weight:700;letter-spacing:.08em;margin-right:14px;font-size:11px">REC</span><span class="t-lq" title="Link quality"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span></span><span class="t-lq"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></span><span class="t-lq"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></span><span class="t-lq"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></span></span>
        </div>
    </div>

    <section class="hero">
        <div class="wrap">
            <h1>WHOOP <span class="hl-y">RANKING</span></h1>
            <p class="hero-tagline">Season standings — live from FPVScores</p>
            <div id="status">Loading…</div>
        </div>
    </section>

    <div class="wrap table-wrap">
        <table class="rank-table">
            <thead>
                <tr>
                    <th>Season Rank</th>
                    <th>Pilot Name</th>
                    <th class="num">Total Score</th>
                    <th class="sep"></th>
                </tr>
                <tr id="race-header-row"></tr>
                <!-- race columns are generated by ranking.js from RACES in events.js -->
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>

    <div class="wrap note">
        Total = average of each pilot's lowest race scores (one drop per event when more than the drop count is flown).
        Scores are fetched live from fpvscores.com.
    </div>

    <script src="events.js"></script>
    <script src="ranking.js"></script>
</body>
</html>
